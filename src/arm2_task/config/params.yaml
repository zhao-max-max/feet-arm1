---
/**:
  ros__parameters:

    # control_node 参数。bash run_arm.sh 会把本文件传给 control_node。
    # 这里仅保留 control_node.cpp 实际 declare_parameter() 读取的参数。

    urdf_path: urdf/arm2.urdf

    # 机器人几何参数，用于解析逆解和动力学模型。
    robot_geometry:
      l1: 0.0845
      l2: 0.350005
      l3: 0.243441
      l4: 0.046

    # move_joint action 请求没有给速度/加速度时，control_node 使用这两个兜底上限。
    max_joint_velocity: 1.2
    max_acceleration_limit: 1.0

    # Link_4 -> camera_link 静态外参。
    camera_extrinsics:
      parent_frame: Link_4
      child_frame: camera_link
      pos: [-0.031763, -0.090418, 0.041408]
      quat: [0.04806441, 0.69986392, -0.06693250, 0.70950712]

    # world(机械臂基座) -> dog_camera_link 静态外参。
    dog_camera_extrinsics:
      parent_frame: world
      child_frame: dog_camera_link
      pos: [0.225000, 0.000000, -0.052000]
      quat: [-0.62721022, 0.62721253, -0.32650618, 0.32650498]

    # 动力学与摩擦力补偿参数。
    # tau_f = fc * tanh(alpha * dq) + fv * dq
    dynamics:
      friction:
        GearRatio: [10.0, 30.0, 30.0, 7.0, 7.0]
        alpha: 80.0
        fc: [0.25, 0.7, 0.25, 0.07, 0.05]
        fv: [0.00026634, 0.00013977, 0.00028228, 0.00012035, 0.00013322]

    # set_controller_mode 只支持 idle / gravity_comp / moving / loaded。
    gains:
      idle:
        kp: [8.0, 2.0, 2.0, 0.5, 0.0]
        kd: [2.5, 0.5, 0.5, 0.2, 0.1]
      gravity_comp:
        kp: [2.0, 8.5, 3.0, 1.2, 0.1]
        kd: [1.0, 2.5, 0.8, 0.2, 0.02]
      moving:
        kp: [13.0, 25.0, 20.0, 15.0, 0.5]
        kd: [2.2, 8.0, 6.5, 2.2, 0.1]
      loaded:
        kp: [10.0, 25.0, 25.0, 15.0, 0.5]
        kd: [3.0, 8.5, 8.0, 3.2, 0.2]

    # control_node 只读取 payload_service，用它创建 set_payload_state 服务。
    inverse_dynamics:
      payload_service: set_payload_state
